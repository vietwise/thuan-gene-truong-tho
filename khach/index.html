<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
/* Layout: phone-first single column; sticky header with logo and 4 tabs; Today = timeline of reminder cards. */
:root{
  --cream:#f5f1e8; --sheet:#fffdf8; --ink:#2b2030; --muted:#6c5f6f; --line:#e6dccd;
  --purple:#8a459a; --magenta:#ca41bc; --moss:#476e70; --yellow:#f5c70f; --saffron:#ecc459;
  --purple-soft:#f1e6f3; --magenta-soft:#fbe7f8; --moss-soft:#e6efee; --saffron-soft:#fbf1d6; --yellow-soft:#fff6cf;
  --water:#3b8fb0; --water-soft:#e3f1f6; --danger:#c62828; --danger-soft:#fdecea; --warn:#e08a00; --warn-soft:#fff4e0;
  --display:Georgia,"Times New Roman",serif; --body:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--cream:#1c1620;--sheet:#251d2a;--ink:#f1e9f3;--muted:#b9a9bd;--line:#3a3040;--purple:#c08bd0;--magenta:#e27ad6;--moss:#8fb8b9;--purple-soft:#33243a;--magenta-soft:#3a2236;--moss-soft:#1f3132;--saffron-soft:#3a3018;--yellow-soft:#3a3412;--water:#6fb6d3;--water-soft:#1d3440;--danger:#ef6b6b;--danger-soft:#3a1d1d;--warn:#f0a83a;--warn-soft:#3a2a12;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cream);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#3d1149,#6b2a7d);color:#fff;padding:10px max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
.brandrow{display:flex;gap:12px;align-items:center;max-width:720px;margin:0 auto}
.brandrow img{width:44px;height:44px;border-radius:11px;box-shadow:0 0 0 2px rgba(245,199,15,.7)}
.brandrow b{font-family:var(--display);font-size:19px;line-height:1.15;display:block}
.brandrow small{opacity:.9;font-size:12.5px}
.tabs{display:flex;gap:4px;max-width:720px;margin:10px auto 0;overflow-x:auto}
.tabs button{flex:1 0 auto;white-space:nowrap;min-width:0;border:0;background:transparent;color:#fff;opacity:.82;padding:10px 8px 11px;font-weight:600;font-size:14px;border-bottom:3px solid transparent;cursor:pointer}
.tabs button.on{opacity:1;border-bottom-color:var(--yellow)}
main{max-width:720px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:grid;gap:16px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
h1,h2,h3{font-family:var(--display);line-height:1.25;margin:0;text-wrap:balance}
h1{font-size:23px;color:var(--purple)}
h2{font-size:19px;color:var(--purple)}
.muted{color:var(--muted)} .small{font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 18px;border-radius:14px;border:0;background:linear-gradient(135deg,#8a459a,#ca41bc);color:#fff;font-weight:700;cursor:pointer;text-decoration:none}
.btn.gold{background:var(--yellow);color:#2b2030}
.btn.ghost{background:var(--sheet);color:var(--purple);border:1.5px solid var(--purple)}
.btn:focus-visible,.tabs button:focus-visible,.chk input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
/* today */
.dayhead{display:grid;gap:8px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:linear-gradient(90deg,#8a459a,#ca41bc,#476e70,#f5c70f,#ecc459);transition:width .3s}
.wbar span{background:var(--water)}
.next{border:2px solid var(--magenta);background:var(--magenta-soft)}
.next .lbl{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--magenta)}
.next .big{font-family:var(--display);font-size:22px;margin:4px 0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--purple);background:var(--sheet);color:var(--purple);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--purple);color:#fff}
.rlist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rcard{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:start;background:var(--sheet);border:1px solid var(--line);border-left:5px solid var(--purple);border-radius:0 14px 14px 0;padding:12px}
.rcard time{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;color:var(--purple)}
.rtitle{font-weight:700}
.rdetail{font-size:14.5px;color:var(--ink);margin-top:2px}
.rmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:12.5px;color:var(--muted)}
.pill{background:var(--purple-soft);color:var(--purple);border-radius:999px;padding:2px 9px;font-weight:600}
.rcard.done{opacity:.55}
.rcard.done .rtitle{text-decoration:line-through}
.rcard.skipped{opacity:.6}
.due{border-color:var(--danger);background:var(--danger-soft)} .due .lbl{color:var(--danger)} .dueitem+.dueitem{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.ask{border:2px dashed var(--purple)}
.linkbtn{border:0;background:none;color:var(--magenta);font-weight:700;text-decoration:underline;cursor:pointer;padding:0}
.rcard.now{box-shadow:0 0 0 2px var(--magenta)}
.chk{display:grid;justify-items:center;gap:2px;font-size:12px;color:var(--muted);cursor:pointer}
.chk input{width:28px;height:28px;accent-color:var(--magenta);cursor:pointer}
.t-thuoc{border-left-color:var(--magenta);background:linear-gradient(90deg,var(--magenta-soft),var(--sheet) 45%)}
.t-bosung{border-left-color:var(--saffron);background:linear-gradient(90deg,var(--saffron-soft),var(--sheet) 45%)}
.t-thucpham,.t-thaoduoc{border-left-color:var(--moss);background:linear-gradient(90deg,var(--moss-soft),var(--sheet) 45%)}
.t-luyentap{border-left-color:var(--yellow);background:linear-gradient(90deg,var(--yellow-soft),var(--sheet) 45%)}
.t-giacngu,.t-theodoi{border-left-color:var(--purple);background:linear-gradient(90deg,var(--purple-soft),var(--sheet) 45%)}
.t-uongnuoc{border-left-color:var(--water);background:linear-gradient(90deg,var(--water-soft),var(--sheet) 45%)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week div{text-align:center;font-size:12px;color:var(--muted)}
.week i{display:block;height:34px;border-radius:9px;background:var(--line);margin-bottom:3px;position:relative;overflow:hidden}
.week i b{position:absolute;left:0;right:0;bottom:0;background:var(--magenta)}
.week .today{color:var(--magenta);font-weight:700}
/* docs */
.doc{font-size:15.5px;overflow-wrap:anywhere}
.doc h1{font-size:21px;margin:4px 0 8px}
.doc h2{font-size:19px;margin:18px 0 8px;padding-top:8px;border-top:2px solid var(--purple)}
.doc h3{font-size:16.5px;margin:14px 0 6px;color:var(--moss)}
.doc p{margin:6px 0} .doc ul,.doc ol{padding-left:22px;margin:6px 0}
.tw{overflow-x:auto;margin:8px 0}
.doc table{border-collapse:collapse;font-size:13.5px;min-width:100%}
.doc th,.doc td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.doc th{background:var(--purple-soft)}
.doc tr:nth-child(even) td{background:var(--saffron-soft)}
.callout{border-left:5px solid;border-radius:0;padding:6px 14px 10px;margin:14px 0}
.callout.danger{border-color:var(--danger);background:var(--danger-soft)} .callout.danger h3,.callout.danger h4,.callout.danger>p:first-child strong{color:var(--danger)}
.callout.warn{border-color:var(--warn);background:var(--warn-soft)} .callout.warn h3,.callout.warn h4,.callout.warn>p:first-child strong{color:var(--warn)}
.callout tr:nth-child(even) td{background:transparent}
details.sec{border:1px solid var(--line);border-radius:14px;background:var(--sheet);padding:0 14px}
details.sec summary{cursor:pointer;padding:12px 0;font-weight:700;color:var(--purple)}
details.sec[open] summary{border-bottom:1px solid var(--line)}
/* welcome */
.hero{text-align:center;display:grid;gap:12px;justify-items:center;padding:24px 16px}
.hero img{width:120px;height:120px;border-radius:26px;box-shadow:0 0 0 3px rgba(245,199,15,.75),0 8px 22px rgba(138,69,154,.3)}
.steps{margin:0;padding-left:22px;display:grid;gap:6px;text-align:left}
.note{font-size:14px;background:var(--purple-soft);border-radius:12px;padding:10px 12px}
.status{min-height:1.3em;font-size:14px}
.readme{font-size:13.5px;color:var(--muted);border-top:3px solid var(--magenta);padding-top:12px}
.quote{margin:0;font-family:var(--display);font-style:italic;font-size:17px;border-left:4px solid var(--magenta);background:var(--saffron-soft);padding:12px 14px}
.quote cite{display:block;font-style:normal;font-family:var(--body);font-size:13.5px;font-weight:700;color:var(--purple);margin-top:4px}
.quote{transition:opacity .6s}
.quote.fade{opacity:0}
/* progress */
.big-pct{font-family:var(--display);font-size:46px;line-height:1;color:var(--purple);font-variant-numeric:tabular-nums}
.verdict{font-family:var(--display);font-size:18px;margin:6px 0 2px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--purple-soft);border-radius:14px;padding:12px}
.kpi b{font-family:var(--display);font-size:24px;color:var(--purple);display:block;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{font-size:13px;color:var(--muted)}
.kpi.water{background:var(--water-soft)} .kpi.water b{color:var(--water)}
.kpi.fire{background:var(--saffron-soft)} .kpi.fire b{color:var(--ink)}
.heat{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;max-width:340px}
.heat i{display:block;aspect-ratio:1;border-radius:5px;background:transparent}
.heat .hd{font-size:11px;color:var(--muted);text-align:center;font-style:normal}
.heat .h0{background:var(--line)} .heat .h1{background:var(--magenta-soft);box-shadow:inset 0 0 0 1px var(--magenta)} .heat .h2{background:var(--magenta);opacity:.55} .heat .h3{background:var(--magenta)}
.heat .ht{outline:2px solid var(--yellow);outline-offset:1px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:3px 10px;align-items:center;margin-top:10px}
.trow .bar{grid-column:1 / -1;height:8px}
.trow b{text-align:right;font-variant-numeric:tabular-nums}
.hist li{margin:4px 0}
.pick{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.pick input{width:22px;height:22px;margin-top:2px;accent-color:var(--purple);flex:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px;border-radius:11px}
.review{border:2px solid var(--warn);background:var(--warn-soft)}
.review .lbl{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warn)}
.rvitem{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.lightrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{border:1.5px dashed var(--moss);background:var(--sheet);color:var(--moss);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:700;cursor:pointer}
.chip.on{background:var(--moss);color:#fff;border-style:solid}
.feel .frow{display:grid;gap:6px;margin-top:12px}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;max-width:340px}
.scale button{min-height:42px;border:1.5px solid var(--purple);background:var(--sheet);color:var(--purple);border-radius:11px;font-weight:700;cursor:pointer}
.scale button.on{background:var(--purple);color:#fff}
.scale-l{display:flex;justify-content:space-between;max-width:340px;font-size:12px;color:var(--muted)}
.feel input{font:inherit;min-height:44px;border:1.5px solid var(--line);border-radius:11px;padding:8px 12px;background:var(--sheet);color:var(--ink);width:140px}
details.grp>summary{list-style:none;display:flex;justify-content:space-between;align-items:baseline;cursor:pointer;padding:4px 2px 8px;border-bottom:2px solid var(--purple);margin-bottom:10px}
details.grp>summary::-webkit-details-marker{display:none}
.gname{font-family:var(--display);font-size:19px;color:var(--purple)}
.gname::before{content:'▸ ';font-size:14px} details[open]>summary .gname::before{content:'▾ '}
.gcount{font-size:13.5px;color:var(--muted);font-weight:600}
.why{margin-top:6px;font-size:13.5px} .why summary{color:var(--magenta);cursor:pointer;font-weight:600} .why p{margin:4px 0 0;color:var(--muted)}
.pill.core{background:var(--magenta-soft);color:var(--magenta)} .pill.snz{background:var(--warn-soft);color:var(--warn)}
.heat .hl{border-radius:50%}
.ftab{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.ftab th,.ftab td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.ftab th:first-child,.ftab td:first-child{text-align:left}
.ftab th{font-size:12.5px;color:var(--muted);font-weight:600}
@media (prefers-reduced-motion:reduce){.bar span{transition:none}.quote{transition:none}}
</style>
</head>
<body>

      (others.length ? '<section class="card"><h2>Hồ sơ khác trên máy</h2><div class="row" style="margin-top:8px">' + others.map(function (id) { return '<button class="btn ghost" type="button" data-sw="' + esc(id) + '">' + esc(store.profiles[id].name) + '</button>'; }).join('') + '</div></section>' : '') +
      '<section class="card"><h2>Sao lưu và chuyển máy</h2><p class="small" style="margin:6px 0 10px">Hồ sơ và tiến độ chỉ nằm trên điện thoại này. Lưu một bản sao vào Tệp, Drive hoặc Zalo của chính bạn. Sang máy mới: mở app, bấm <b>Nhập hồ sơ từ chuyên gia</b>, chọn file sao lưu.</p><div class="row"><button class="btn gold" id="bk" type="button">Lưu bản sao</button></div><p class="small muted" style="margin:8px 0 0" id="bkMsg">' + (store.lastBackup ? 'Lần sao lưu gần nhất: ' + new Date(store.lastBackup).toLocaleDateString('vi-VN') + '.' : 'Chưa sao lưu lần nào.') + '</p></section>' +
      '<section class="card"><h2>Liên hệ chuyên gia</h2><p class="small" style="margin:6px 0 10px">' + EXPERT.name + '</p><div class="row"><code style="font-size:16px;font-weight:700;color:var(--purple);user-select:all">' + EXPERT.email + '</code><button class="btn ghost" id="cp" type="button">Sao chép email</button></div></section>' +
      '<section class="card"><h2>Xoá hồ sơ khỏi máy</h2><p class="small" style="margin:6px 0 10px">Xoá hồ sơ và các dấu đã làm xong trên điện thoại này.</p><div class="row"><button class="btn ghost" id="del" type="button">Xoá hồ sơ này</button><button class="btn" id="delYes" type="button" hidden>Xoá vĩnh viễn</button></div></section>' + readme();
    $('#pick').addEventListener('click', function () { $('#file').click(); });
    $('#bk').addEventListener('click', function () { saveBackup(null, $('#bkMsg')); });
    $$('button[data-sw]', m).forEach(function (b) { b.addEventListener('click', function () { store.active = b.dataset.sw; save(); view = 'today'; render(); }); });
    $('#cp').addEventListener('click', function (e) { var b = e.currentTarget; try { navigator.clipboard.writeText(EXPERT.email).then(function () { b.textContent = 'Đã sao chép'; }, function () { b.textContent = 'Bôi đen để sao chép'; }); } catch (x) { b.textContent = 'Bôi đen để sao chép'; } });
    $('#del').addEventListener('click', function () { $('#delYes').hidden = false; $('#del').textContent = 'Huỷ'; $('#del').onclick = function () { renderMe(p, m); }; });
    $('#delYes').addEventListener('click', function () { delete store.profiles[p.id]; ['done', 'skip', 'feel', 'light', 'review', 'snooze', 'icsOff'].forEach(function (k) { delete store[k][p.id]; }); store.active = Object.keys(store.profiles)[0] || null; save(); view = 'today'; render(); });
  }
  function readme() {
    return '<footer class="readme"><b>Đọc trước khi dùng.</b> Giao thức trường thọ giúp hướng về đồng hồ và xu hướng sinh học, không phải là lời khuyên chữa bệnh. Tài liệu hỗ trợ lối sống song song với điều trị, không thay thế kết luận y khoa của bác sĩ. Gene là xu hướng; xét nghiệm và triệu chứng quyết định can thiệp. Dữ liệu sức khoẻ và gene là dữ liệu nhạy cảm: sẽ do chính chủ chọn tải lên ứng dụng, hoặc nếu người khác tải giúp phải có sự đồng ý.' + (memOnly ? '<br><b>Lưu ý:</b> trình duyệt đang chặn lưu dữ liệu, hồ sơ sẽ mất khi đóng app. Hãy mở bằng Safari hoặc Chrome thường (không ẩn danh).' : '') + '</footer>';
  }
  $$('.tabs button').forEach(function (b) { b.addEventListener('click', function () { view = b.dataset.v; flashMsg = ''; render(); }); });

  // refresh "next up" each minute and when the app comes back to the screen
  setInterval(function () { var typing = document.activeElement && document.activeElement.id === 'kg'; if (view === 'today' && cur() && !document.hidden && !typing) { keepScroll = true; render(); } tick(); }, 30000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', function (e) { var d = e.data || {}; if (d.type === 'tt-act') { act(d.pid, d.day, d.rid, d.act); render(); } });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && (view === 'today' || view === 'stats') && cur() && !(document.activeElement && document.activeElement.id === 'kg')) { keepScroll = true; render(); } });

  load();
  (function fromUrl2() { try { var u = new URL(location.href), a = u.searchParams.get('act'); if (a) { act(u.searchParams.get('pid'), u.searchParams.get('day'), u.searchParams.get('rid'), a); history.replaceState(null, '', location.pathname); } } catch (e) {} })();
  render(); setTimeout(tick, 1500);
  if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
})();
</script>
</body>
</html>

  h += '<div class="mo" style="margin-top:10px">Quạt Thần Vietwise CTV là trợ lý Action Selling 9 bước dành cho đội ngũ phụng sự Hệ sinh thái Vietwise Easy Tỉnh Thức và cộng tác viên Siêu thị Vietwise, theo bản chuẩn Vy và Cố Vấn Nhất Phương Hồng chốt ngày 23/10/2026, ghép với Gương Thần của ThS. Lê Nhất Phương Hồng. App dùng miễn phí cho cộng tác viên, chạy được khi không có mạng.<br><br>Thắc mắc thì mang vào buổi Action Selling trưa thứ Sáu, hoặc <a href="https://zalo.me/0977206471" target="_blank" rel="noopener">nhắn Zalo Siêu thị</a>.<br><br>Quyền riêng tư: app không thu thập dữ liệu. Số Zalo của khách bạn ghi vào chỉ dùng để mở cuộc trò chuyện trên máy bạn. Xin phép khách trước khi ghi thông tin sức khỏe của gia đình họ.</div></details>';
  return h;
};
function saoLuu() {
  var b = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }), a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = 'quat-than-ctv-' + homNay() + '.json'; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function khoiPhuc(f) {
  if (!f) return; var r = new FileReader();
  r.onload = function () { try { var d = JSON.parse(r.result); if (!d || !Array.isArray(d.khach)) throw 0; hoi('Thay dữ liệu trên máy bằng file này? (' + d.khach.length + ' khách, ' + (d.review || []).length + ' review)', 'Thay dữ liệu', function () { localStorage.setItem(KEY, JSON.stringify(d)); S = load(); toast('Đã khôi phục'); go(''); render(); });} catch (e) { toast('File không đúng định dạng sao lưu của app'); } };
  r.readAsText(f);
}

// ---------- Điều hướng ----------
var CL_TRUOC = null;
function muaXu(them) {
  try { if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return; } catch (e) {}
  var n = Math.min(14, 5 + them), w = document.createElement('div'); w.className = 'mua-xu'; w.setAttribute('aria-hidden', 'true');
  for (var i = 0; i < n; i++) { var x = document.createElement('i'); x.innerHTML = ART.xuRoi(); x.style.left = (5 + Math.random() * 88) + '%'; x.style.animationDelay = (Math.random() * .6).toFixed(2) + 's'; x.style.width = x.style.height = (18 + Math.random() * 16).toFixed(0) + 'px'; w.appendChild(x); }
  var b = document.createElement('div'); b.className = 'xu-them'; b.textContent = '+' + them + ' CL'; w.appendChild(b);
  document.body.appendChild(w); setTimeout(function () { if (w.parentNode) w.parentNode.removeChild(w); }, 2600);
}
function render() {
  var p = (location.hash || '#').slice(1).split('/'), t = p[0] || 'home';
  if (!V[t]) t = 'home';
  var html = V[t](p);
  if (html === '') return;
  document.getElementById('v').innerHTML = html;
  var cl = tinhCL().tong; if (CL_TRUOC !== null && cl > CL_TRUOC) muaXu(cl - CL_TRUOC); CL_TRUOC = cl;
  var tab = t;
  if (t === 'cl') tab = 'home';
  if (t === 'don') tab = 'quan-ly';
  if (t === 'tap-noi') tab = TAP && TAP.ve.indexOf('#khach') === 0 ? 'khach' : 'review';
  if (t === 'cong-cu') tab = { usb: 'nan', 'ca-kho': 'nan', soat: 'review' }[p[1]] || 'khach';
  [].forEach.call(document.querySelectorAll('#nav a'), function (a) { a.classList.toggle('on', a.getAttribute('data-t') === tab); });
}
var lastHash = '';
window.addEventListener('hashchange', function () { var h = location.hash; render(); if (h.split('/').length < 3 || h.indexOf('#khach/') !== 0) window.scrollTo(0, 0); else { var n = h.split('/')[2], e = document.getElementById('n' + n); if (e) e.scrollIntoView({ block: 'start' }); } lastHash = h; });

function taiSanPham() {
  var cu = null; try { cu = JSON.parse(localStorage.getItem('quat-than-sp')); } catch (e) {}
  if (cu) { SP = cu; render(); }
  fetch('san-pham.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (d) { SP = d; try { localStorage.setItem('quat-than-sp', JSON.stringify(d)); } catch (e) {} render(); }).catch(function () {});
}
render(); taiSanPham();

if ('serviceWorker' in navigator) {
  var hadCtl = !!navigator.serviceWorker.controller, reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () { if (hadCtl && !reloaded) { reloaded = true; location.reload(); } });
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) { reg.update && reg.update(); }).catch(function () {}); });
}

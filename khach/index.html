<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thuận Gene Trường Thọ NPH</title>
<meta name="description" content="App Thuận Gene Trường Thọ cho khách của Chuyên gia Nhất Phương Hồng: thẻ nhắc hằng ngày và bản tóm tắt giao thức, dùng được khi không có mạng.">
<meta name="theme-color" content="#4a1858">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thuận Gene Trường Thọ NPH">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<style>
/* Layout: phone-first single column; sticky header with logo and 4 tabs; Today = timeline of reminder cards. */
:root{
  --cream:#f5f1e8; --sheet:#fffdf8; --ink:#2b2030; --muted:#6c5f6f; --line:#e6dccd;
  --purple:#8a459a; --magenta:#ca41bc; --moss:#476e70; --yellow:#f5c70f; --saffron:#ecc459;
  --purple-soft:#f1e6f3; --magenta-soft:#fbe7f8; --moss-soft:#e6efee; --saffron-soft:#fbf1d6; --yellow-soft:#fff6cf;
  --water:#3b8fb0; --water-soft:#e3f1f6; --danger:#c62828; --danger-soft:#fdecea; --warn:#e08a00; --warn-soft:#fff4e0;
  --display:Georgia,"Times New Roman",serif; --body:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--cream:#1c1620;--sheet:#251d2a;--ink:#f1e9f3;--muted:#b9a9bd;--line:#3a3040;--purple:#c08bd0;--magenta:#e27ad6;--moss:#8fb8b9;--purple-soft:#33243a;--magenta-soft:#3a2236;--moss-soft:#1f3132;--saffron-soft:#3a3018;--yellow-soft:#3a3412;--water:#6fb6d3;--water-soft:#1d3440;--danger:#ef6b6b;--danger-soft:#3a1d1d;--warn:#f0a83a;--warn-soft:#3a2a12;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cream);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#3d1149,#6b2a7d);color:#fff;padding:10px max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
.brandrow{display:flex;gap:12px;align-items:center;max-width:720px;margin:0 auto}
.brandrow img{width:44px;height:44px;border-radius:11px;box-shadow:0 0 0 2px rgba(245,199,15,.7)}
.brandrow b{font-family:var(--display);font-size:19px;line-height:1.15;display:block}
.brandrow small{opacity:.9;font-size:12.5px}
.tabs{display:flex;gap:4px;max-width:720px;margin:10px auto 0;overflow-x:auto}
.tabs button{flex:1 0 auto;white-space:nowrap;min-width:0;border:0;background:transparent;color:#fff;opacity:.82;padding:10px 8px 11px;font-weight:600;font-size:14px;border-bottom:3px solid transparent;cursor:pointer}
.tabs button.on{opacity:1;border-bottom-color:var(--yellow)}
main{max-width:720px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:grid;gap:16px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
h1,h2,h3{font-family:var(--display);line-height:1.25;margin:0;text-wrap:balance}
h1{font-size:23px;color:var(--purple)}
h2{font-size:19px;color:var(--purple)}
.muted{color:var(--muted)} .small{font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 18px;border-radius:14px;border:0;background:linear-gradient(135deg,#8a459a,#ca41bc);color:#fff;font-weight:700;cursor:pointer;text-decoration:none}
.btn.gold{background:var(--yellow);color:#2b2030}
.btn.ghost{background:var(--sheet);color:var(--purple);border:1.5px solid var(--purple)}
.btn:focus-visible,.tabs button:focus-visible,.chk input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
/* today */
.dayhead{display:grid;gap:8px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:linear-gradient(90deg,#8a459a,#ca41bc,#476e70,#f5c70f,#ecc459);transition:width .3s}
.wbar span{background:var(--water)}
.next{border:2px solid var(--magenta);background:var(--magenta-soft)}
.next .lbl{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--magenta)}
.next .big{font-family:var(--display);font-size:22px;margin:4px 0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--purple);background:var(--sheet);color:var(--purple);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--purple);color:#fff}
.rlist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rcard{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:start;background:var(--sheet);border:1px solid var(--line);border-left:5px solid var(--purple);border-radius:0 14px 14px 0;padding:12px}
.rcard time{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;color:var(--purple)}
.rtitle{font-weight:700}
.rdetail{font-size:14.5px;color:var(--ink);margin-top:2px}
.rmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:12.5px;color:var(--muted)}
.pill{background:var(--purple-soft);color:var(--purple);border-radius:999px;padding:2px 9px;font-weight:600}
.rcard.done{opacity:.55}
.rcard.done .rtitle{text-decoration:line-through}
.rcard.skipped{opacity:.6}
.due{border-color:var(--danger);background:var(--danger-soft)} .due .lbl{color:var(--danger)} .dueitem+.dueitem{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.ask{border:2px dashed var(--purple)}
.linkbtn{border:0;background:none;color:var(--magenta);font-weight:700;text-decoration:underline;cursor:pointer;padding:0}
.rcard.now{box-shadow:0 0 0 2px var(--magenta)}
.chk{display:grid;justify-items:center;gap:2px;font-size:12px;color:var(--muted);cursor:pointer}
.chk input{width:28px;height:28px;accent-color:var(--magenta);cursor:pointer}
.t-thuoc{border-left-color:var(--magenta);background:linear-gradient(90deg,var(--magenta-soft),var(--sheet) 45%)}
.t-bosung{border-left-color:var(--saffron);background:linear-gradient(90deg,var(--saffron-soft),var(--sheet) 45%)}
.t-thucpham,.t-thaoduoc{border-left-color:var(--moss);background:linear-gradient(90deg,var(--moss-soft),var(--sheet) 45%)}
.t-luyentap{border-left-color:var(--yellow);background:linear-gradient(90deg,var(--yellow-soft),var(--sheet) 45%)}
.t-giacngu,.t-theodoi{border-left-color:var(--purple);background:linear-gradient(90deg,var(--purple-soft),var(--sheet) 45%)}
.t-uongnuoc{border-left-color:var(--water);background:linear-gradient(90deg,var(--water-soft),var(--sheet) 45%)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week div{text-align:center;font-size:12px;color:var(--muted)}
.week i{display:block;height:34px;border-radius:9px;background:var(--line);margin-bottom:3px;position:relative;overflow:hidden}
.week i b{position:absolute;left:0;right:0;bottom:0;background:var(--magenta)}
.week .today{color:var(--magenta);font-weight:700}
/* docs */
.doc{font-size:15.5px;overflow-wrap:anywhere}
.doc h1{font-size:21px;margin:4px 0 8px}
.doc h2{font-size:19px;margin:18px 0 8px;padding-top:8px;border-top:2px solid var(--purple)}
.doc h3{font-size:16.5px;margin:14px 0 6px;color:var(--moss)}
.doc p{margin:6px 0} .doc ul,.doc ol{padding-left:22px;margin:6px 0}
.tw{overflow-x:auto;margin:8px 0}
.doc table{border-collapse:collapse;font-size:13.5px;min-width:100%}
.doc th,.doc td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.doc th{background:var(--purple-soft)}
.doc tr:nth-child(even) td{background:var(--saffron-soft)}
.callout{border-left:5px solid;border-radius:0;padding:6px 14px 10px;margin:14px 0}
.callout.danger{border-color:var(--danger);background:var(--danger-soft)} .callout.danger h3,.callout.danger h4,.callout.danger>p:first-child strong{color:var(--danger)}
.callout.warn{border-color:var(--warn);background:var(--warn-soft)} .callout.warn h3,.callout.warn h4,.callout.warn>p:first-child strong{color:var(--warn)}
.callout tr:nth-child(even) td{background:transparent}
details.sec{border:1px solid var(--line);border-radius:14px;background:var(--sheet);padding:0 14px}
details.sec summary{cursor:pointer;padding:12px 0;font-weight:700;color:var(--purple)}
details.sec[open] summary{border-bottom:1px solid var(--line)}
/* welcome */
.hero{text-align:center;display:grid;gap:12px;justify-items:center;padding:24px 16px}
.hero img{width:120px;height:120px;border-radius:26px;box-shadow:0 0 0 3px rgba(245,199,15,.75),0 8px 22px rgba(138,69,154,.3)}
.steps{margin:0;padding-left:22px;display:grid;gap:6px;text-align:left}
.note{font-size:14px;background:var(--purple-soft);border-radius:12px;padding:10px 12px}
.status{min-height:1.3em;font-size:14px}
.meas .thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.meas .th{position:relative;width:76px;height:110px;border-radius:10px;overflow:hidden;background:var(--line)}
.meas .th img{width:100%;height:100%;object-fit:cover;display:block}
.meas .th button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:1;cursor:pointer}
.meas .mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;margin-top:12px}
.meas .mgrid label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.meas .mgrid input{font:inherit;min-height:42px;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--sheet);color:var(--ink);width:100%}
.mtab td.ph{color:var(--purple);font-weight:600}
.sitefoot{margin-top:8px;border-top:3px solid var(--magenta);padding:16px 2px 8px;display:grid;gap:12px;font-size:13.5px;color:var(--muted)}
.sitefoot .brand{display:flex;gap:12px;align-items:center;color:var(--ink)}
.sitefoot .brand img{width:52px;height:52px;border-radius:12px;flex:none}
.sitefoot .brand p{margin:0;font-size:14px}
.sitefoot .ups{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.sitefoot .ups a{display:inline-flex;align-items:center;min-height:38px;padding:6px 12px;border-radius:99px;border:1.5px solid var(--purple);color:var(--purple);text-decoration:none;font-weight:600;font-size:13.5px;background:var(--sheet)}
.sitefoot .ups a.z{background:var(--purple);color:#fff}
.sitefoot p.disc{margin:0}
.readme{font-size:13.5px;color:var(--muted);border-top:3px solid var(--magenta);padding-top:12px}
.quote{margin:0;font-family:var(--display);font-style:italic;font-size:17px;border-left:4px solid var(--magenta);background:var(--saffron-soft);padding:12px 14px}
.quote cite{display:block;font-style:normal;font-family:var(--body);font-size:13.5px;font-weight:700;color:var(--purple);margin-top:4px}
.quote{transition:opacity .6s}
.quote.fade{opacity:0}
/* progress */
.big-pct{font-family:var(--display);font-size:46px;line-height:1;color:var(--purple);font-variant-numeric:tabular-nums}
.verdict{font-family:var(--display);font-size:18px;margin:6px 0 2px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--purple-soft);border-radius:14px;padding:12px}
.kpi b{font-family:var(--display);font-size:24px;color:var(--purple);display:block;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{font-size:13px;color:var(--muted)}
.kpi.water{background:var(--water-soft)} .kpi.water b{color:var(--water)}
.kpi.fire{background:var(--saffron-soft)} .kpi.fire b{color:var(--ink)}
.heat{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;max-width:340px}
.heat i{display:block;aspect-ratio:1;border-radius:5px;background:transparent}
.heat .hd{font-size:11px;color:var(--muted);text-align:center;font-style:normal}
.heat .h0{background:var(--line)} .heat .h1{background:var(--magenta-soft);box-shadow:inset 0 0 0 1px var(--magenta)} .heat .h2{background:var(--magenta);opacity:.55} .heat .h3{background:var(--magenta)}
.heat .ht{outline:2px solid var(--yellow);outline-offset:1px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:3px 10px;align-items:center;margin-top:10px}
.trow .bar{grid-column:1 / -1;height:8px}
.trow b{text-align:right;font-variant-numeric:tabular-nums}
.hist li{margin:4px 0}
.pick{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.pick input{width:22px;height:22px;margin-top:2px;accent-color:var(--purple);flex:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.offer{border:2px solid var(--yellow);background:var(--saffron-soft)}
.offer .big{font-family:var(--display);font-size:19px;font-weight:700;color:var(--purple)}
.offer .lbl{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.offer a.btn{text-decoration:none;display:inline-flex;align-items:center}
.cat li{margin:8px 0}
.orc-inv{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center;background:linear-gradient(135deg,#3A2347,#5B3A72);color:#F8EBD0;border:0}
.orc-inv img,.orc-mini img{width:72px;height:auto;border-radius:10px;box-shadow:0 6px 16px rgba(0,0,0,.3);display:block}
.orc-inv .lbl,.orc-mini .lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:#E0AE4E}
.orc-inv h2{color:#F8EBD0;margin:2px 0 4px;font-family:Georgia,"Times New Roman",serif}
.orc-inv p{margin:0 0 10px;opacity:.92;font-size:14.5px}
.orc-inv .btn{background:#E0AE4E;color:#3A2347;border:0}
.orc-mini{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:start;background:#FBF3DF;border:2px solid var(--og,#5B3A72);color:#3A2347}
.orc-mini h3{margin:2px 0 4px;font-family:Georgia,serif;font-size:18px;color:var(--og,#5B3A72)}
.orc-mini .oq{font-style:italic;margin:0 0 8px;font-size:14.5px}
.orc-task{background:rgba(224,174,78,.22);border-radius:10px;padding:8px 10px;font-size:14px;margin:0 0 6px}
.orc-mini .linkbtn{color:#5B3A72}
.oart{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--og,#5B3A72);color:#F8EBD0;text-align:center;font-family:Georgia,"Times New Roman",serif;background-image:radial-gradient(circle at 50% 42%,rgba(224,174,78,.35) 0 22%,transparent 23%),repeating-linear-gradient(45deg,rgba(248,235,208,.08) 0 6px,transparent 6px 12px)}
.oart::after{content:"";position:absolute;inset:6px;border:1.5px solid rgba(224,174,78,.7);border-radius:inherit;pointer-events:none}
.oart .on{font-size:13px;letter-spacing:.12em;opacity:.9}.oart .os{color:#E0AE4E;font-size:30px;line-height:1}.oart .ot{font-size:13px;font-weight:700;padding:0 6px}
.oart.big{aspect-ratio:3/2;border-radius:0}.oart.big .on{font-size:18px}.oart.big .os{font-size:64px}.oart.big .ot{font-size:26px}
.oart.sm{width:72px;aspect-ratio:2/3;border-radius:10px;box-shadow:0 6px 16px rgba(0,0,0,.3)}.oart.sm .os{font-size:24px}.oart.sm .ot{font-size:10.5px}.oart.sm::after{inset:4px}
.oart.xs{width:100%;height:100%;border-radius:8px}.oart.xs .on{font-size:10px}.oart.xs .os{font-size:16px}.oart.xs .ot{display:none}.oart.xs::after{inset:3px}
.oimg.big{display:block;width:100%;height:auto}.oimg.sm{width:72px;border-radius:10px}.oimg.xs{width:100%;height:100%;object-fit:cover}
.pill.orc{background:#3A2347;color:#E0AE4E}
#orc{position:fixed;inset:0;z-index:50;background:#F3E5C8;color:#3A2347;overflow:auto;-webkit-overflow-scrolling:touch}
#orc .ow{max-width:520px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 40px;display:grid;gap:16px;justify-items:center;text-align:center;min-height:100%}
#orc .otop{width:100%;display:flex;justify-content:space-between;align-items:center}
#orc .otop b{font-family:Georgia,serif;font-size:16px}
#orc .x{border:2px solid #3A2347;background:#FBF3DF;color:#3A2347;border-radius:99px;min-height:40px;padding:6px 14px;font:inherit;font-weight:600;cursor:pointer}
#orc h2{font-family:Georgia,"Times New Roman",serif;color:#3A2347;font-size:24px;margin:4px 0}
#orc .breath{width:150px;height:150px;border-radius:50%;background:#E0AE4E;display:grid;place-items:center;font-weight:700;color:#3A2347;box-shadow:0 0 0 14px rgba(224,174,78,.28),0 0 0 32px rgba(224,174,78,.13);margin:30px auto;transition:transform 4s ease-in-out}
#orc .breath.big{transform:scale(1.3)}
#orc .ob{background:#5B3A72;color:#F8EBD0;border:0;border-radius:99px;min-height:48px;padding:12px 24px;font:inherit;font-weight:700;cursor:pointer}
#orc .ob.gold{background:#E0AE4E;color:#3A2347}
#orc .ol{background:none;border:0;color:#3A2347;text-decoration:underline;font:inherit;cursor:pointer;padding:8px}
.ofan{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:6px 0}
.ofan button{width:74px;height:110px;border-radius:10px;border:0;padding:0;cursor:pointer;background:#5B3A72 center/cover no-repeat;box-shadow:0 8px 20px rgba(58,35,71,.3);transition:transform .25s}
.ofan button:hover,.ofan button:focus-visible{transform:translateY(-10px)}
.ofan.shuffle button{animation:osh .6s ease 2}
@keyframes osh{50%{transform:translateY(-14px) rotate(-6deg)}}
.oface{width:100%;background:#FBF3DF;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(58,35,71,.25);border:4px solid var(--og,#5B3A72);text-align:left;animation:oflip .7s ease}
@keyframes oflip{from{transform:rotateY(90deg)}to{transform:none}}
.oface img{display:block;width:100%;height:auto;background:#fff}
.oface .ob2{padding:16px 18px 18px;display:grid;gap:10px}
.oface .gp{display:inline-block;background:var(--og,#5B3A72);color:#F8EBD0;border-radius:99px;padding:3px 12px;font-size:12.5px;font-weight:600;justify-self:start}
.oface h3{font-family:Georgia,serif;margin:0;font-size:22px;color:var(--og,#5B3A72)}
.oface p{margin:0}
.oface .oqb{border-left:5px solid var(--og,#5B3A72);background:rgba(224,174,78,.2);border-radius:0 12px 12px 0;padding:8px 12px}
.oface .oqb b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--og,#5B3A72)}
.oface .otask{border:2px dashed var(--og,#5B3A72);border-radius:14px;padding:10px 12px}
.oface .otask b.t{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--og,#5B3A72);margin-bottom:2px}
.ofoot{font-size:13.5px;opacity:.9;margin:0}
.ofoot a{color:#5B3A72;font-weight:700}
.ogarden{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px;margin-top:10px}
.ogarden button{border:0;padding:0;border-radius:8px;overflow:hidden;cursor:pointer;background:#5B3A72 center/cover no-repeat;aspect-ratio:2/3}
.ogarden button img{width:100%;height:100%;object-fit:cover;display:block}
.ogarden button.lock{opacity:.35;cursor:default}
.orefl textarea{width:100%;min-height:70px;border:1.5px solid var(--line);border-radius:12px;padding:10px;font:inherit;background:var(--sheet);color:var(--ink)}
@media (prefers-reduced-motion:reduce){.oface,.ofan.shuffle button{animation:none}#orc .breath{transition:none}}
